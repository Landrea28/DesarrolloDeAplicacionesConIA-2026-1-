<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente RAG de Ciberseguridad</title>
    <!-- Bootstrap CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Unna:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ink: #1b1b1f;
            --steel: #2f3a45;
            --mist: #e8eef2;
            --sand: #f4efe6;
            --accent: #cf8f2a;
            --accent-dark: #a46c18;
            --chat-bg: #f7f4ee;
        }
        body {
            font-family: "Spectral", "Merriweather", "Georgia", serif;
            color: var(--ink);
            background: radial-gradient(circle at top, #f2efe8 0%, #e3e9ee 40%, #f8f6f0 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(90deg, #1d232b 0%, #2c3a45 100%);
        }
        .navbar-brand {
            font-family: "Unna", "Playfair Display", serif;
            letter-spacing: 0.5px;
        }
        .card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(29, 35, 43, 0.12);
            background: rgba(255, 255, 255, 0.92);
        }
        .card-header {
            border-bottom: none;
            background: transparent;
        }
        .card-title {
            font-family: "Unna", "Playfair Display", serif;
        }
        .upload-zone {
            border: 2px dashed rgba(47, 58, 69, 0.35);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            background: #fdfcf9;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .upload-zone.dragover {
            border-color: var(--accent);
            background: #fff7ea;
        }
        .upload-zone input {
            margin-top: 12px;
        }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
        }
        .btn-outline-primary {
            border-color: var(--accent);
            color: var(--accent-dark);
        }
        .btn-outline-primary:hover {
            background: var(--accent);
            color: #fff;
        }
        .chat-container {
            height: 60vh;
            overflow-y: auto;
            background: var(--chat-bg);
            padding: 1.2rem;
            border-radius: 16px;
            border: 1px solid rgba(47, 58, 69, 0.12);
        }
        .message {
            margin-bottom: 1rem;
            animation: fadeInUp 0.25s ease;
        }
        .user-message { text-align: right; }
        .bot-message { text-align: left; }
        .message-content {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 80%;
            line-height: 1.5;
        }
        .user-message .message-content {
            background: #2a3d4f;
            color: #f7f7f7;
        }
        .bot-message .message-content {
            background: #ffffff;
            color: var(--ink);
            border: 1px solid rgba(47, 58, 69, 0.1);
        }
        .source-container {
            font-size: 0.9em;
            background: #fff7e6;
            padding: 12px;
            border-radius: 12px;
            margin-top: 6px;
            display: none;
        }
        .source-toggle {
            font-size: 0.85em;
            color: var(--accent-dark);
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(207, 143, 42, 0.15);
            color: var(--accent-dark);
            font-size: 0.85em;
            margin-top: 8px;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">🤖 Asistente RAG Ciberseguridad</a>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
