{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Asistente RAG de ciberseguridad: sube un documento y haz preguntas basadas únicamente en su contenido.">
    <meta name="theme-color" content="#1d232b">
    <title>Asistente RAG de Ciberseguridad</title>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Unna:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'rag_app/css/styles.css' %}">
</head>
<body>
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark" aria-label="Barra principal">
            <div class="container">
                <a class="navbar-brand" href="/" aria-label="Inicio del Asistente RAG de Ciberseguridad">
                    Asistente RAG de Ciberseguridad
                </a>
            </div>
        </nav>
    </header>

    <main id="main-content" class="container mt-4" role="main">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <small>Asistente RAG de Ciberseguridad &middot; Construido con Django, Groq y Hugging Face</small>
    </footer>

    <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
